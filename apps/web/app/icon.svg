  <g transform="translate(0 -2)" fill="none">
    <path d="M9 15.5C9 10 12 6.5 16 5.5c0 5.5-3 9-7 10Z" fill="#c2410c"/>
    <path d="M2 16.5C4.5 12 6.5 9.5 9 15.5" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
